# Structured (base:) so these merge with project.yml's base/configs settings.
# A flat settings block here would be dropped once project.yml uses base/configs,
# leaving BASE_BUNDLE_IDENTIFIER / APP_GROUP_IDENTIFIER / DEVELOPMENT_TEAM empty.
settings:
  base:
    APP_DISPLAY_NAME: Chipsera
    PRODUCTION_APP_NAME: Chipsera
    # Chipsera identifiers for the new (individual) Apple Developer account.
    # Bundle IDs and app groups are globally unique across Apple, so these must be
    # fresh names not already claimed by the old team.
    APP_GROUP_IDENTIFIER: group.online.privy7.chipsera
    BASE_BUNDLE_IDENTIFIER: online.privy7.chipsera
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "colors/accent-color"
    # TODO: replace with the new account's Team ID once enrolled (Xcode > Settings >
    # Accounts, or App Store Connect > Membership). Device signing fails until this is set.
    DEVELOPMENT_TEAM: GF9S7S9W5F

    # Optional configuration to load accounts from Element Classic.
    CLASSIC_APP_GROUP_IDENTIFIER: group.im.vector
    CLASSIC_APP_KEYCHAIN_SERVICE_IDENTIFIER: im.vector.app.encryption-manager-service
    CLASSIC_APP_KEYCHAIN_ACCESS_GROUP_IDENTIFIER: "$(DEVELOPMENT_TEAM).im.vector.app.keychain.shared"
